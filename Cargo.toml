[package]
name = "xdg-desktop-portal-froggy"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[dependencies]
egui-sf2g.git = "https://github.com/crumblingstatue/egui-sf2g.git"
egui-file-dialog.git = "https://github.com/mukilan/egui-file-dialog.git"
egui-file-dialog.rev = "ba313e380d415cc2e26741b2a92fe4fa466679d6"
egui_system_font_frog.git = "https://github.com/crumblingstatue/egui_system_font_frog.git"
zbus = "6.2"
dirs = "7.0.0"
serde.version = "1"
serde.features = ["derive"]
ron = "0.12"
glob = "0.3"
tokio.version = "1.54.1"
tokio.features = ["rt-multi-thread", "sync"]
x11rb = "0.13"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
